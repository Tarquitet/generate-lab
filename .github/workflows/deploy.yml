name: Deploy to GitHub Pages

on:
  # Se ejecuta cuando haces push a la rama main
  push:
    branches: ['main']

  # Permite ejecutarlo manualmente desde la pestaña Actions de GitHub
  workflow_dispatch:

# Permite que el workflow escriba en el repositorio (necesario para push a gh-pages)
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Instalar Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. Instalar dependencias
      - name: Install dependencies
        run: bun install

      # 4. Construir el proyecto (Vite usará base: '/generate-lab/' automáticamente)
      - name: Build project
        run: bun run build

      # 5. Desplegar en la rama gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false # Limpia archivos viejos antes de desplegar
